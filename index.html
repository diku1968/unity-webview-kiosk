    <button onclick="triggerScan()">Scan Barcode</button>

    <script>
        // 1. Send data FROM JavaScript TO Unity
        function triggerScan() {
            window.location.href = "uniwebview://hardware-scan?item=PROD-9988";
        }

        function triggerPrint() {
            window.location.href = "uniwebview://print-receipt";
        }

        // 2. Receive data FROM Unity TO JavaScript
        function updateKioskStatus(message) {
            document.getElementById("status").innerText = "Status: " + message;
        }
    </script>
